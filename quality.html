<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep Quality History</title>
<link rel="stylesheet" href="theme-toggle.css">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
</head>
<body class="quality-page">
  <div id="nav-container"></div>
  <div class="container">
    <div id="quality-container"></div>
  </div>

  <script src="dev-git-branch.js"></script>
  <script src="local-supabase-presets.js"></script>
  <script src="sleep-utils.js"></script>
  <script src="nightly.js"></script>
  <script src="quality.js"></script>
  <script>
    (async function initQualityPage() {
      await initI18n(document);
      document.getElementById('nav-container').innerHTML = renderNavBar('quality');
      initDayNightTheme();
      initRemainingWakeNav();
      var qualityRoot = document.getElementById('quality-container');
      var L = window.__restoreQualityLifecycle;
      if (qualityRoot && L && typeof L.mount === 'function') {
        L.mount(qualityRoot, {});
        var params = new URLSearchParams(window.location.search);
        if (
          params.get('lifecycleHarness') === '1' &&
          typeof isDevBuildContext === 'function' &&
          isDevBuildContext()
        ) {
          console.info('[lifecycleHarness] quality: mount → unmount → mount');
          L.unmount();
          L.mount(qualityRoot, {});
        }
      }
    })();
  </script>
</body>
</html>
