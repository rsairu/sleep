<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep Statistics</title>
<link rel="stylesheet" href="theme-toggle.css">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
</head>
<body class="page-stats">
  <div id="nav-container"></div>
  <div id="stats-page-root" class="stats-page-shell">
    <div class="container stats-page-shell__title">
      <h1 class="page-title">Sleep Statistics</h1>
      <p class="stats-page-about-link"><a class="content-link" href="about.html#sleep-statistics">More about these statistics</a></p>
    </div>
    <div class="stats-page-shell__sticky">
      <div class="container stats-page-shell__sticky-inner">
        <div id="stats-period-scope" class="stats-period-scope"></div>
      </div>
    </div>
    <div class="container stats-page-shell__matrix">
      <div id="stats-container"></div>
    </div>
  </div>

  <script src="dev-git-branch.js"></script>
  <script src="local-supabase-presets.js"></script>
  <script src="routes-data.js"></script>
  <script src="sleep-utils.js"></script>
  <script src="stats-aggregates.js"></script>
  <script src="stats.js"></script>
  <script>
    (async function initStatsPage() {
      await initI18n(document);
      document.getElementById('nav-container').innerHTML = renderNavBar('stats');
      initDayNightTheme();
      initRemainingWakeNav();
      var statsRoot = document.getElementById('stats-page-root');
      var S = window.__restoreStatsLifecycle;
      if (statsRoot && S && typeof S.mount === 'function') {
        S.mount(statsRoot, {});
        var params = new URLSearchParams(window.location.search);
        if (
          params.get('lifecycleHarness') === '1' &&
          typeof isDevBuildContext === 'function' &&
          isDevBuildContext()
        ) {
          console.info('[lifecycleHarness] stats: start mount → unmount → mount');
          S.unmount();
          console.info('[lifecycleHarness] stats: after unmount (period bar + matrix cleared)');
          S.mount(statsRoot, {});
          console.info('[lifecycleHarness] stats: second mount complete');
        }
      }
    })();
  </script>
</body>
</html>
